[gmail]
source = notmuch://~/.local/share/mail/gmail
maildir-store = ~/.local/share/mail/gmail
folders-sort = Unread,Inbox,Sent,Drafts,Trash,AllUnread,Starred,Replied,Forwarded,Attachments,All
folders = Unread,Inbox,Sent,Drafts,Trash,AllUnread,Starred,Replied,Forwarded,Attachments,All

from = Quang Dang <quang.dang.n42@gmail.com>

# All aliases this account can send from. When replying to a message that
# was addressed to one of these, aerc sets the From header to that alias.
aliases = Quang Dang <ammon134@gmail.com>, Quang Dang <quang.dang.n42@gmail.com>, Quang Dang <quangdn42@gmail.com>, Quang Dang <quang.dang.n42+*@gmail.com>

outgoing = sendmail

default = Unread
query-map = ~/.config/aerc/gmail_queries

check-mail = 2m
check-mail-cmd = ~/.config/aerc/mail-sync

multi-file-strategy = act-all

# Local completion: Google contacts (synced by vdirsyncer, queried with khard)
# merged with the ranked address book built from mail history
# (maildir-rank-addr, regenerated by the mail-sync script).
address-book-cmd = addr-book-combine -c "khard email --remove-first-line --parsable '%s'" -c "rg -F -i -- '%s' ~/.cache/maildir-rank-addr/addressbook.tsv"
