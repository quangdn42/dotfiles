[addressbooks]
[[google]]
path = ~/.local/share/contacts/

[general]
debug = no
default_action = list
editor = nvim
merge_editor = nvim, -d

[contact table]
display = first_name
group_by_addressbook = no
localize_dates = no
preferred_email_address_type = pref, work, home
preferred_phone_number_type = pref, cell, work, home
sort = last_name
show_nicknames = yes
show_uids = no

[vcard]
preferred_version = 3.0
search_in_source_files = yes
skip_unparsable = no