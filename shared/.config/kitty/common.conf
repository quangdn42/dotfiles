# Portable Kitty behavior shared by macOS and Linux.

# Text rendering
bold_font auto
italic_font auto
bold_italic_font auto
disable_ligatures cursor
text_composition_strategy platform

# Use Kitty's bundled, unmodified Nerd Font for private-use symbols.
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

cursor_blink_interval 0
copy_on_select clipboard

# Pane navigation. The kittens pass these keys through when tmux is focused.
map ctrl+h kitten neighboring_window.py left ctrl+h
map ctrl+j kitten neighboring_window.py down ctrl+j
map ctrl+k kitten neighboring_window.py up ctrl+k
map ctrl+l kitten neighboring_window.py right ctrl+l

map ctrl+down kitten relative_resize.py down 3 ctrl+down
map ctrl+up kitten relative_resize.py up 3 ctrl+up
map ctrl+left kitten relative_resize.py left 3 ctrl+left
map ctrl+right kitten relative_resize.py right 3 ctrl+right

# smart-splits.nvim handles the same keys while Neovim is focused.
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l
map --when-focus-on var:IS_NVIM ctrl+down
map --when-focus-on var:IS_NVIM ctrl+up
map --when-focus-on var:IS_NVIM ctrl+left
map --when-focus-on var:IS_NVIM ctrl+right

# Restrict remote control to the per-instance socket used by smart-splits.nvim.
allow_remote_control socket-only
listen_on unix:kitty

# Scrollback
scrollback_pager nvim -u ~/.config/kitty/scrollback.lua -i NONE --noplugin -n -c 'autocmd VimEnter * normal! G' -c 'call nvim_open_term(0, {})' -c 'set nomodified nolist' -
scrollback_pager_history_size 10

# Tabs
tab_bar_style powerline
tab_title_template "{title}{fmt.bold}{f'  {num_windows}' if num_windows > 1 and layout_name == 'stack' else ''}"
