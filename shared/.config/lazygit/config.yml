git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never -s --tabs=2

# Temporary Omarchy 4 compatibility: LazyGit cannot infer an editor preset from
# Omarchy's `EDITOR="omarchy-launch-editor --inline"` wrapper. Remove this once
# LazyGit supports that wrapper.
os:
  editPreset: nvim

gui:
  # Fraction of the total screen width to use for the left side section. You may want to pick a small number (e.g. 0.2) if you're using a narrow screen, so that you can see more of the main section.
  # Number from 0 to 1.0.
  sidePanelWidth: 0.25
