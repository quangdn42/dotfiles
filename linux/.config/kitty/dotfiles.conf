# Portable Kitty behavior shared with macOS.
include common.conf

# Preserve Omarchy 4's per-process socket used by global cwd-aware bindings.
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# Splits avoid Hyprland's Super+Enter application bindings.
map ctrl+enter launch --location=vsplit --cwd=current
map ctrl+shift+enter launch --location=hsplit --cwd=current

# Kitty tabs mirror macOS brackets; add Ctrl to reorder.
map super+shift+] next_tab
map super+shift+[ previous_tab
map super+ctrl+shift+] move_tab_forward
map super+ctrl+shift+[ move_tab_backward

# Remaining Kitty-local tab and layout actions avoid compositor shortcuts.
map ctrl+alt+m toggle_layout stack
map ctrl+alt+z next_layout
map ctrl+alt+shift+t set_tab_title
map ctrl+alt+t new_tab_with_cwd !neighbor
map ctrl+alt+s swap_with_window

tab_bar_min_tabs 2
