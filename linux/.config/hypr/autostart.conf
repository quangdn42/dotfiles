# exec-once = uwsm-app -- my-service

exec-once = fcitx5 -d

# Start rbw-agent at login without relying on a timer-spawned rbw client.
# `rbw lock` starts/seeds the agent without prompting; `rbw unlock` gives one
# optional login prompt. If cancelled, the locked agent still lets rbw's SSH
# agent prompt later from lazygit/ssh.
exec-once = sh -c '/usr/bin/rbw lock; /usr/bin/rbw unlock || true'
