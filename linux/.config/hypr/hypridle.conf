general {
    lock_cmd = omarchy-system-lock                         # lock screen and 1password
    on_lock_cmd = rbw lock                                 # lock rbw when a lock screen engages
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock && rbw lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 25 minutes
listener {
    timeout = 1500
    on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

# Lock 5 minutes after screensaver start (screensaver resets idle timer, so count from there + 2s margin)
listener {
    timeout = 302
    on-timeout = omarchy-system-lock
    on-resume = omarchy-system-wake
}
