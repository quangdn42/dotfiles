include common.conf

# Font
font_family family="JetBrains Mono" style=ExtraLight
font_size 15.0

# macOS
hide_window_decorations titlebar-only
macos_option_as_alt both

# Shell integration
shell_integration enabled
tab_bar_min_tabs 1

# Kitty tabs: use the macOS bracket convention and add Ctrl to reorder.
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map cmd+ctrl+shift+] move_tab_forward
map cmd+ctrl+shift+[ move_tab_backward

map cmd+ctrl+m toggle_layout stack
map cmd+ctrl+z next_layout
map cmd+enter launch --location=vsplit --cwd=current
map cmd+shift+enter launch --location=hsplit --cwd=current
map cmd+ctrl+t set_tab_title
map cmd+t new_tab_with_cwd !neighbor
map cmd+ctrl+s swap_with_window

# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME
